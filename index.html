<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lot to Lot</title>

  <!-- Cấu hình PWA & Icon -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <meta name="theme-color" content="#2E7D32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lot to Lot" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F4FAF6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F4FAF6;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #loader img {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(46, 125, 50, 0.18);
    }
    #loader p {
      color: #1B5E20;
      font-size: 14px;
      font-weight: 600;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      background-color: #F4FAF6;
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="./icon.png" alt="Lot to Lot" />
    <p>Đang tải Lot to Lot...</p>
  </div>

  <iframe
    id="app-frame"
    src="https://lot-to-lot-xn2o6yh7yyzpwnkaha63u6.streamlit.app/?embed=true"
    allow="clipboard-read; clipboard-write"
    onload="document.getElementById('loader').style.opacity='0'; setTimeout(() => document.getElementById('loader').style.display='none', 300);"
  ></iframe>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
